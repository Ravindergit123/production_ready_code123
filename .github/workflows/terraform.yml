# Multi-Environment (pre & prod) Terraform Security & CI/CD Pipeline Workflow
name: "Terraform Multi-Env (Pre & Prod) CI/CD Pipeline"

on:
  push:
    branches:
      - main
      - pre
      - dev
  pull_request:
    branches:
      - main
      - pre
      - dev
  workflow_dispatch:
    inputs:
      target_env:
        description: "Select Environment to Deploy"
        required: true
        default: "pre"
        type: choice
        options:
          - pre
          - prod

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  security-and-lint:
    name: "TFLint & Checkov Security Scan"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: "v0.50.0"

      - name: Init TFLint
        run: tflint --init

      - name: Run TFLint
        run: tflint -f compact --recursive

      - name: Checkov IaC Security Scan
        uses: bridgecrewio/checkov-action@master
        with:
          framework: terraform
          output_format: cli
          soft_fail: true

  deploy:
    name: "Terraform Deploy (${{ matrix.environment }})"
    needs: security-and-lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [pre, prod]

    if: |
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target_env == matrix.environment)) ||
      (github.event_name == 'push' && ((matrix.environment == 'prod' && github.ref == 'refs/heads/main') || (matrix.environment == 'pre' && (github.ref == 'refs/heads/pre' || github.ref == 'refs/heads/dev')))) ||
      (github.event_name == 'pull_request' && ((matrix.environment == 'prod' && github.base_ref == 'main') || (matrix.environment == 'pre' && (github.base_ref == 'pre' || github.base_ref == 'dev'))))

    defaults:
      run:
        working-directory: ./Root

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Export Azure ARM Environment Variables for Terraform
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          if [ -n "$AZURE_CREDENTIALS" ]; then
            echo "ARM_CLIENT_ID=$(echo "$AZURE_CREDENTIALS" | jq -r '.clientId')" >> $GITHUB_ENV
            echo "ARM_CLIENT_SECRET=$(echo "$AZURE_CREDENTIALS" | jq -r '.clientSecret')" >> $GITHUB_ENV
            echo "ARM_SUBSCRIPTION_ID=$(echo "$AZURE_CREDENTIALS" | jq -r '.subscriptionId')" >> $GITHUB_ENV
            echo "ARM_TENANT_ID=$(echo "$AZURE_CREDENTIALS" | jq -r '.tenantId')" >> $GITHUB_ENV
          else
            echo "ARM_CLIENT_ID=$AZURE_CLIENT_ID" >> $GITHUB_ENV
            echo "ARM_CLIENT_SECRET=$AZURE_CLIENT_SECRET" >> $GITHUB_ENV
            echo "ARM_SUBSCRIPTION_ID=$AZURE_SUBSCRIPTION_ID" >> $GITHUB_ENV
            echo "ARM_TENANT_ID=$AZURE_TENANT_ID" >> $GITHUB_ENV
          fi

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive

      - name: Terraform Init (${{ matrix.environment }})
        id: init
        run: |
          terraform init \
            -backend-config="key=${{ matrix.environment }}.terraform.tfstate" \
            -reconfigure

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan (${{ matrix.environment }})
        id: plan
        run: |
          if [ -f "${{ matrix.environment }}.tfvars" ]; then
            terraform plan -var-file="${{ matrix.environment }}.tfvars" -no-color -input=false
          else
            terraform plan -no-color -input=false
          fi

      - name: Terraform Apply (${{ matrix.environment }})
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        id: apply
        run: |
          if [ -f "${{ matrix.environment }}.tfvars" ]; then
            terraform apply -var-file="${{ matrix.environment }}.tfvars" -auto-approve -input=false
          else
            terraform apply -auto-approve -input=false
          fi
